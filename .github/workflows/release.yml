name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            archive: zip

          - name: macOS universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libglib2.0-dev

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: |
          cargo build --release --bin hashcalc --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release --bin hashcalc --target aarch64-apple-darwin
          cargo build --release --bin hashcalc --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/hashcalc \
            target/x86_64-apple-darwin/release/hashcalc \
            -output target/universal-apple-darwin/release/hashcalc

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          dir="hashcalc-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/hashcalc" "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "hashcalc-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\hashcalc.exe" "$dir\"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Build Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version `
            "/DBinDir=${{ github.workspace }}\target\${{ matrix.target }}\release" `
            packaging\hashcalc.iss

      - uses: actions/upload-artifact@v4
        with:
          name: hashcalc-${{ matrix.name }}
          path: hashcalc-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: hashcalc-Windows-setup
          path: hashcalc-*-win-setup.exe

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  update-pkgbuild:
    name: Update PKGBUILD sha256sum
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Compute sha256sum and update PKGBUILD
        run: |
          URL="https://github.com/Antidote1911/hashcalc/archive/${{ github.ref_name }}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          sed -i "s/sha256sums=.*/sha256sums=('$SHA')/" packaging/PKGBUILD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/PKGBUILD
          git commit -m "chore: update PKGBUILD sha256sum for ${{ github.ref_name }}"
          git push
