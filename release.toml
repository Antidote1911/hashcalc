publish = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release {{version}}"

[[pre-release-replacements]]
file    = "packaging/PKGBUILD"
search  = "pkgver=.*"
replace = "pkgver={{version}}"

[[pre-release-replacements]]
file    = "packaging/PKGBUILD"
search  = "pkgrel=.*"
replace = "pkgrel=1"

# Reset to SKIP — the CI job will compute the real hash after the tag is pushed.
[[pre-release-replacements]]
file    = "packaging/PKGBUILD"
search  = "sha256sums=.*"
replace = "sha256sums=('SKIP')"
